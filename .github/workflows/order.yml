name: OrderService

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/OrderService.api/**'
      - 'tests/OrderService.Tests/**'
      - '.github/workflows/order.yml'
  workflow_dispatch:

env:
  PROJECT: src/OrderService.api/OrderService.api.csproj
  TEST_PROJECT: tests/OrderService.Tests/OrderService.Tests.csproj
  AZURE_WEBAPP_NAME: app-eshop-order

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Test
      run: dotnet test ${{ env.TEST_PROJECT }} --configuration Release
    - name: Publish
      run: dotnet publish ${{ env.PROJECT }} --configuration Release --output ./publish
    - uses: actions/upload-artifact@v4
      with:
        name: order
        path: ./publish

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: order
        path: ./publish
    - name: Deploy to Azure App Service
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZURE_ORDER_PUBLISH_PROFILE }}
        package: ./publish
