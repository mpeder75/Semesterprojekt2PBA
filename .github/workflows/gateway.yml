name: ApiGateway

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/ApiGateway/**'
      - '.github/workflows/gateway.yml'
      - 'global.json'
      - 'Directory.Packages.props'
  workflow_dispatch:

env:
  PROJECT: src/ApiGateway/ApiGateway.csproj
  AZURE_WEBAPP_NAME: eshop-yarp-gateway

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json
    - name: Publish
      run: dotnet publish ${{ env.PROJECT }} --configuration Release --output ./publish
    - uses: actions/upload-artifact@v4
      with:
        name: gateway
        path: ./publish

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: gateway
        path: ./publish
    - name: Deploy to Azure App Service
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.YARP_PUBLISH_PROFILE }}
        package: ./publish
