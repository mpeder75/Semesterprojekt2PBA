name: InventoryService

on:
  push:
    branches: [main]
    paths:
      - 'src/InventoryService.api/**'
      - 'tests/InventoryService.Tests/**'
      - 'tests/IntegrationTests/InventoryService/**'
      - '.github/workflows/inventory.yml'
      - 'Directory.Packages.props'
      - 'global.json'
  pull_request:
    branches: [main]
    paths:
      - 'src/InventoryService.api/**'
      - 'tests/InventoryService.Tests/**'
      - 'tests/IntegrationTests/InventoryService/**'
      - '.github/workflows/inventory.yml'
      - 'Directory.Packages.props'
      - 'global.json'
  workflow_dispatch:

permissions:
  contents: read

env:
  AZURE_WEBAPP_NAME: app-eshop-inventory

defaults:
  run:
    working-directory: src/InventoryService.api

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test ../../tests/InventoryService.Tests/InventoryService.Tests.csproj --configuration Release
      - name: Publish
        if: github.event_name != 'pull_request'
        run: dotnet publish InventoryService.api.csproj --configuration Release --output ../../publish
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: inventory
          path: ./publish
          if-no-files-found: error

  integration-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test with SQL Server LocalDB
        run: dotnet test ../../tests/IntegrationTests/InventoryService/InventoryService.IntegrationTests.csproj --configuration Release

  deploy:
    needs: [build, integration-tests]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: inventory
          path: ./publish
      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_INVENTORY_PUBLISH_PROFILE }}
          package: ./publish
