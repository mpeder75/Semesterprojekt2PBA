services:
  rabbitmq:
    image: rabbitmq:4.3-management-alpine
    container_name: rabbitmqSemesterprojekt2
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  rabbitmq_data: